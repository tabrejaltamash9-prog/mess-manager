name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on: git tag v1.0.0 && git push --tags

jobs:
  build-android:
    name: Build Android APK via EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Build Android APK (preview profile)
        working-directory: mobile
        run: |
          BUILD_JSON=$(eas build --platform android --profile preview --non-interactive --json)
          BUILD_ID=$(echo "$BUILD_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          echo "Build ID: $BUILD_ID"
          eas build:download --build-id "$BUILD_ID" --non-interactive
          mv *.apk mess-qr-app-android.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS Simulator (preview profile)
        working-directory: mobile
        run: |
          BUILD_JSON=$(eas build --platform ios --profile preview --non-interactive --json)
          BUILD_ID=$(echo "$BUILD_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          echo "Build ID: $BUILD_ID"
          eas build:download --build-id "$BUILD_ID" --non-interactive
          mv *.tar.gz mess-qr-app-ios.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mess QR App ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📦 Mess QR App ${{ github.ref_name }}

            ### Android Installation
            1. Download `mess-qr-app-android.apk` below
            2. Enable "Install from unknown sources" on your Android device
            3. Install the APK

            ### iOS Simulator Installation
            1. Download `mess-qr-app-ios.tar.gz` below and extract it
            2. Drag and drop the `.app` file into your running iOS Simulator

            ### What's New
            See commit history for changes in this release.
          files: |
            mobile/mess-qr-app-android.apk
            mobile/mess-qr-app-ios.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
