name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on: git tag v1.0.0 && git push --tags

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK via EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Build Android APK (preview profile)
        working-directory: mobile
        run: |
          BUILD_JSON=$(eas build --platform android --profile preview --non-interactive --json)
          BUILD_ID=$(echo "$BUILD_JSON" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data[0]['id'] if isinstance(data, list) else data['id'])")
          echo "Build ID: $BUILD_ID"

          # 1. Try direct download from EAS artifacts URL if available
          APK_URL=$(echo "$BUILD_JSON" | python3 -c "import sys,json; data=json.load(sys.stdin); item=data[0] if isinstance(data, list) else data; print(item.get('artifacts', {}).get('applicationArchiveUrl') or '')" 2>/dev/null || echo "")
          if [ -n "$APK_URL" ] && [ "$APK_URL" != "None" ]; then
            echo "Downloading APK directly from $APK_URL..."
            curl -L -o mess-qr-app-android.apk "$APK_URL"
          fi

          # 2. If direct download was not available, download via EAS CLI and copy from cache
          if [ ! -s mess-qr-app-android.apk ]; then
            echo "Downloading via eas build:download..."
            eas build:download --build-id "$BUILD_ID" --non-interactive
            APK_CACHED=$(find /tmp -name "*.apk" 2>/dev/null | head -n 1)
            if [ -n "$APK_CACHED" ]; then
              echo "Found cached APK at $APK_CACHED, copying..."
              cp "$APK_CACHED" mess-qr-app-android.apk
            fi
          fi

          # 3. Verify the file exists and is not empty
          if [ ! -s mess-qr-app-android.apk ]; then
            echo "Error: Failed to find or download mess-qr-app-android.apk"
            exit 1
          fi
          echo "Successfully prepared mess-qr-app-android.apk:"
          ls -lh mess-qr-app-android.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mess QR App ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📦 Mess QR App ${{ github.ref_name }}

            ### Android Installation
            1. Download `mess-qr-app-android.apk` below
            2. Enable "Install from unknown sources" on your Android device
            3. Install the APK

            ### What's New
            See commit history for changes in this release.
          files: |
            mobile/mess-qr-app-android.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
